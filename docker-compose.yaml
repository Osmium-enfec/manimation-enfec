version: "3.9"

services:
  manimations-studio:

    image: manimations-studio:latest

    container_name: manimations-studio

    restart: unless-stopped

    ports:
      - "8088:80"
    mem_limit: 4g

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      MANIMATIONS_DATA_DIR: /projects

    volumes:
      - ./projects:/projects
      - ./media:/app/media
    # studio.db and themes/ are stored under ./projects when MANIMATIONS_DATA_DIR=/projects
